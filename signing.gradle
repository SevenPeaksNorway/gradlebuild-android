apply plugin: 'com.alexvasilkov.sign'

android {
    signingConfigs {
        debug {
            storeFile file("${rootDir}/libraries/GradleBuild/sign/debug.keystore")
        }
        release {
            storeFile file("${rootDir}/libraries/GradleBuild/sign/debug.keystore")
            keyAlias 'androiddebugkey'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
        }
    }
}
