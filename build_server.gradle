/*
This script will automatically set up 'ci' task that can be used on build server along with MODE
build parameter to trigger all necessary tasks.

Usage example in build.gradle:
apply from: "${rootDir}/libraries/GradleBuild/build_server.gradle"
 */

/*
 * Creates build task 'ci' to use with Jenkins.
 *
 * It expects MODE build parameter (provided with -DMODE=XXX by Jenkins) to provide flavor name.
 * If MODE is not set or set to 'BUILD', 'ALL' or 'BUILD_ALL' then all debug flavors will be built.
 * If MODE is set to 'PUBLISH' or 'PUBLISH_ALL' then all release flavors will be uploaded to Play.
 * If MODE starts with 'PUBLISH_' (e.g. 'PUBLISH_PROD') then rest part will be consider as a release
 * flavor name to be uploaded to Play.
 * Otherwise MODE will be treated as a debug flavor name (with optional 'BUILD_' prefix).
 *
 * This task will assemble, check and either upload debug build(s) to Fabric or upload release
 * build(s) to Play for given flavor(s).
 */
project.afterEvaluate {
    final boolean isOnBuildServer = System.getenv('BUILD_NUMBER') ?: false
    println "BUILD on build server: $isOnBuildServer"

    final boolean isOnMaster = isMasterBranch()
    println "BUILD on master: $isOnMaster"

    final String mode = System.properties.MODE
    def (isPublish, isBundle, buildMode, flavors) = parseMode(mode)

    println "BUILD MODE: mode = $buildMode, flavors = $flavors, publish = $isPublish, bundle = $isBundle"

    final ci = 'ci'
    final check = 'checkAll'

    rootProject.task ci

    rootProject.addTaskDependency(ci, check)

    flavors.each { String flavor ->
        final fullName = flavor.capitalize() + buildMode.capitalize()

        final assemble = "assemble${fullName}"
        final bundle = "bundle${fullName}"

        rootProject.addTaskDependency(ci, isBundle ? bundle : assemble)
        rootProject.addTaskDependency(ci, "lint${fullName}")
        rootProject.addTaskDependency(ci, "test${fullName}UnitTest")

        if (isOnMaster) {
            // Only distributing from master branch
            if (isPublish) {
                // Uploading to Play
                rootProject.addTaskDependency(ci,
                        isBundle ? "publishBundle${fullName}" : "publishApk${fullName}")
            } else {
                final fbUpload = "appDistributionUpload${fullName}"
                final fbUploadTask = project.tasks.findByName(fbUpload)

                if (fbUploadTask != null) {
                    // Uploading to Firebase
                    project.addTaskDependency(fbUpload, assemble)
                    project.addTaskDependency(fbUpload, check)
                    rootProject.addTaskDependency(ci, fbUpload)

                    fbUploadTask.doLast {
                        // Notifying that changelog is uploaded, if needed
                        if (isOnBuildServer && project.ext.has("onChangelogUploaded")) {
                            onChangelogUploaded()
                        }
                    }
                }
            }
        }
    }
}

private def parseMode(String mode) {
    boolean publish = false
    boolean bundle = false
    String singleFlavor = null

    if (!mode || mode == 'BUILD') {
        mode = 'ALL'
    } else if (mode.startsWith('BUILD_')) {
        mode = mode.replace('BUILD_', '')
    } else if (mode == 'PUBLISH') {
        mode = 'ALL'
        publish = true
    } else if (mode.startsWith('PUBLISH_')) {
        mode = mode.replace('PUBLISH_', '')
        publish = true
    }

    if (mode == 'BUNDLE') {
        mode = 'ALL'
        bundle = true
    } else if (mode.startsWith('BUNDLE_')) {
        mode = mode.replace('BUNDLE_', '')
        bundle = true
    }

    if (mode != 'ALL') {
        singleFlavor = toCamelCase(mode)
    }

    final String buildMode = publish ? 'release' : 'debug'
    final List<String> flavors

    if (singleFlavor) {
        flavors = Arrays.asList(singleFlavor)
    } else {
        flavors = project.android.applicationVariants
                .findAll { it.buildType.name == buildMode }
                .collect { it.flavorName }
    }

    return [publish, bundle, buildMode, flavors]
}

Project.metaClass.getTask = { String taskName, Closure closure ->
    delegate.tasks.forEach { task -> if (task.name == taskName) closure.call(task) }
    delegate.tasks.whenTaskAdded { task -> if (task.name == taskName) closure.call(task) }
}

Project.metaClass.findTasks = { String taskName, Closure closure ->
    delegate.tasks.forEach { task -> if (task.name == taskName) closure.call(task) }
    delegate.tasks.whenTaskAdded { task -> if (task.name == taskName) closure.call(task) }
    delegate.subprojects { sub -> sub.findTasks(taskName, closure) }
}

Project.metaClass.addTaskDependency = { String sourceTask, String targetTask ->
    final project = delegate
    project.getTask(sourceTask) { source ->
        project.findTasks(targetTask) { target ->
            println "Added task dependency: ${source.name} -> :${target.project.name}:${target.name}"
            source.dependsOn target
        }
    }
}

private static String toCamelCase(String snakeCase) {
    return snakeCase.toLowerCase().replaceAll(/_\w/) { it[1].toUpperCase() }
}

private static boolean isMasterBranch() {
    try {
        def commit = 'git rev-parse HEAD'.execute().text.trim()
        def final branch = "git branch -r --contains ${commit}".execute().text.trim()
        println "BUILD branch: ${branch}"
        return branch.find('/master$')
    } catch (Exception ignored) {
        System.err.println 'Current branch is not available'
        return false
    }
}
