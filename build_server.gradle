/*
This script will automatically set up 'ci' task that can be used on build server along with MODE
build parameter to trigger all necessary tasks.

Usage example in build.gradle:
apply from: "${rootDir}/libraries/GradleBuild/build_server.gradle"
 */

/*
 * Creates build task 'ci' to use with Jenkins.
 *
 * It expects MODE build parameter (provided with -DMODE=XXX by Jenkins) to provide flavor name.
 * See "parseMode()" method comments below.
 *
 * This task will assemble, check and optionally upload debug build(s) to App Distribution
 * or upload release build(s) to Play for given flavor(s).
 */
project.afterEvaluate {
    final boolean isOnBuildServer = System.getenv('BUILD_NUMBER') ?: false
    log "BUILD | On build server: $isOnBuildServer"

    final boolean isOnMaster = isMasterBranch()
    log "BUILD | On master branch: $isOnMaster"

    final String mode = System.properties.MODE
    def (isPublish, isBundle, variants) = parseMode(mode)

    log "BUILD | Variants: $variants | Publish = $isPublish | Bundle = $isBundle"

    final ci = 'ci'
    final check = 'checkAll'

    rootProject.task ci

    rootProject.addTaskDependency(ci, check)

    variants.each { String variant ->
        final fullName = variant.capitalize()
        final boolean isHuawei = fullName.contains("Huawei")

        final assemble = "assemble${fullName}"
        final bundle = "bundle${fullName}"

        rootProject.addTaskDependency(ci, isBundle && !isHuawei ? bundle : assemble)
        rootProject.addTaskDependency(ci, "lint${fullName}")
        rootProject.addTaskDependency(ci, "test${fullName}UnitTest")

        if (isOnMaster) {
            // Only distributing from master branch
            if (isPublish) {
                if (!isHuawei) {
                    // Uploading to Play, if configured
                    rootProject.addTaskDependency(ci,
                            isBundle ? "publish${fullName}Bundle" : "publish${fullName}Apk")
                }
            } else {
                final fBTestLabTask = "runFlank"
                final isFBTestLabTaskExisting = project.tasks.findByName(fBTestLabTask)
                if (isFBTestLabTaskExisting != null) {
                    final assembleDevMockTask = "assembleDevMock"
                    final assembleDevMockAndroidTestTask = "assembleDevMockAndroidTest"

                    project.addTaskDependency(assembleDevMockTask, assemble)
                    project.addTaskDependency(assembleDevMockTask, check)

                    project.addTaskDependency(assembleDevMockAndroidTestTask, assemble)
                    project.addTaskDependency(assembleDevMockAndroidTestTask, check)

                    project.addTaskDependency(fBTestLabTask, assemble)
                    project.addTaskDependency(fBTestLabTask, check)
                    project.addTaskDependency(fBTestLabTask, assembleDevMockTask)
                    project.addTaskDependency(fBTestLabTask, assembleDevMockAndroidTestTask)
                    rootProject.addTaskDependency(ci, assembleDevMockTask)
                    rootProject.addTaskDependency(ci, assembleDevMockAndroidTestTask)
                    rootProject.addTaskDependency(ci, fBTestLabTask)
                }

                final fbUpload = "appDistributionUpload${fullName}"
                final fbUploadTask = project.tasks.findByName(fbUpload)

                if (fbUploadTask != null) {
                    // Uploading to Firebase
                    project.addTaskDependency(fbUpload, assemble)
                    project.addTaskDependency(fbUpload, check)
                    project.addTaskDependency(fbUpload, fBTestLabTask)
                    rootProject.addTaskDependency(ci, fbUpload)

                    fbUploadTask.doLast {
                        // Notifying that changelog is uploaded, if needed
                        if (isOnBuildServer && project.ext.has("onChangelogUploaded")) {
                            onChangelogUploaded()
                        }
                    }
                }
            }
        }
    }
}

// Play distribution plugin default settings
if (hasProperty('play')) {
    play {
        track = 'alpha'
        resolutionStrategy = "ignore"
    }
}

private def parseMode(String mode) {
    /*
     "mode" should consist of the next parts: {build_mode}_{bundle}_{flavor}

     "build-mode" options:
     * BUILD - debug build mode
     * PUBLISH - release build mode + distribute to Play if configured
     * empty - debug build mode

     "bundle" options:
     * BUNDLE - build app bundle instead of apk
     * empty - build regular apk

     "flavor" options:
     * flavor name part (snake case) - picking all flavors containing this part
     * ALL - picking all flavors
     * empty - picking all flavors

     E.g. "PUBLISH_PROD", "BUILD", "PUBLISH_BUNDLE", "BUILD_HUAWEI_DEV", "PROD"
    */

    boolean publish = false
    boolean bundle = false
    String flavorPart = null

    if (!mode || mode == 'BUILD') {
        mode = 'ALL'
    } else if (mode.startsWith('BUILD_')) {
        mode = mode.replace('BUILD_', '')
    } else if (mode == 'PUBLISH') {
        mode = 'ALL'
        publish = true
    } else if (mode.startsWith('PUBLISH_')) {
        mode = mode.replace('PUBLISH_', '')
        publish = true
    }

    if (mode == 'BUNDLE') {
        mode = 'ALL'
        bundle = true
    } else if (mode.startsWith('BUNDLE_')) {
        mode = mode.replace('BUNDLE_', '')
        bundle = true
    }

    if (mode != 'ALL') {
        flavorPart = toCamelCase(mode)
    }

    final String buildMode = publish ? 'release' : 'debug'

    final List<String> variants = project.android.applicationVariants
            .findAll {
                it.buildType.name.startsWith(buildMode) &&
                        (flavorPart == null ||
                                it.flavorName.contains(flavorPart) ||
                                it.flavorName.contains(flavorPart.capitalize()))
            }
            .collect { it.name }

    Collections.reverse(variants)

    return [publish, bundle, variants]
}

Project.metaClass.getTask = { String taskName, Closure closure ->
    delegate.tasks.forEach { task -> if (task.name == taskName) closure.call(task) }
    delegate.tasks.whenTaskAdded { task -> if (task.name == taskName) closure.call(task) }
}

Project.metaClass.findTasks = { String taskName, Closure closure ->
    delegate.tasks.forEach { task -> if (task.name == taskName) closure.call(task) }
    delegate.tasks.whenTaskAdded { task -> if (task.name == taskName) closure.call(task) }
    delegate.subprojects { sub -> sub.findTasks(taskName, closure) }
}

Project.metaClass.addTaskDependency = { String sourceTask, String targetTask ->
    final project = delegate
    project.getTask(sourceTask) { source ->
        project.findTasks(targetTask) { target ->
            log "Added task dependency: ${source.name} -> :${target.project.name}:${target.name}"
            source.dependsOn target
        }
    }
}

private static String toCamelCase(String snakeCase) {
    return snakeCase.toLowerCase().replaceAll(/_\w/) { it[1].toUpperCase() }
}

private static boolean isMasterBranch() {
    try {
        def commit = 'git rev-parse HEAD'.execute().text.trim()
        def final branch = "git branch -r --contains ${commit}".execute().text.trim()
        log "BUILD | Branch(es): \"${branch.replaceAll("\\s*\n\\s*", "\", \"")}\""
        return branch.find('(?m)/master$')
    } catch (Exception ignored) {
        if (verbose()) System.err.println 'Current branch is not available'
        return false
    }
}

private static boolean verbose() {
    return System.properties.VERBOSE != "false"
}

private static void log(String message) {
    if (verbose()) println message
}
