// Import this file after android plugin with 'apply from: "${rootDir}/.../checks.gradle"'

def final REPORTS_DIR = 'build/reports'

apply plugin: 'checkstyle'

android {
    lintOptions {
        // http://google.github.io/android-gradle-dsl/current/com.android.build.gradle.internal.dsl.LintOptions.html
        lintConfig file("${rootDir}/libraries/GradleBuild/checks/lint.xml")
        abortOnError false // Errors report will be generated and shown by Jenkins
        htmlOutput file("${REPORTS_DIR}/lint/lint-results.html")
        xmlOutput file("${REPORTS_DIR}/lint/lint-results.xml")
    }
}

checkstyle {
    // https://docs.gradle.org/current/dsl/org.gradle.api.plugins.quality.CheckstyleExtension.html
    toolVersion = '6.15'
    configFile file("${rootDir}/libraries/GradleBuild/checks/checkstyle.xml")
}

task checkstyle(type: Checkstyle) {
    // https:docs.gradle.org/current/dsl/org.gradle.api.plugins.quality.Checkstyle.html
    source 'src'
    include '**/*.java', '**/*.xml'
    exclude '**/gen/**'
    classpath = files()
    reports {
        html {
            destination "${REPORTS_DIR}/checkstyle/checkstyle-result.html"
        }
        xml {
            destination "${REPORTS_DIR}/checkstyle/checkstyle-result.xml"
        }
    }
}

project.tasks.getByName('check').dependsOn 'checkstyle'
