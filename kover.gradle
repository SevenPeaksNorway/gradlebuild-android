def koverExclusions = [
        // Application class
        "*App*",
        // Generated files
        "*BuildConfig*",
        "*Hilt*",
        "*Factory*",
        "*Injector",
        "*Module*",
        "*di.*",
        "*Dao*",
        "*Dao_Impl*",
        "*Database*",
        "*Database_Impl*",
        // Database converters and data classes
        "*Converter",
        "*Db*",
        // Compose themes, components and navigation
        "*.theme*",
        "*.components*",
        "*.navigation*",
        // Util directories
        "*util.*",
        "*.ext*",
        "*utils*",
        // Custom components
        "*custom*",
        "*components.*",
        "*ui.bottombar.*",
        // Compose previews directories
        "*preview.*",
        // Specific files (Fragments, Views, Adapters, etc.)
        "*Activity*",
        "*Destination*",
        "*Screen*",
        "*Broadcaster*",
        "*Navigation*",
        "*Design*",
        // KotlinX Serialization generated code
        "*serializer*"
]

def koverExcludeAnnotations = [
        "Composable",
        "Preview*"
]

koverReport {
    filters {
        excludes {
            def classesExclusionsFile = file("${project.rootProject.projectDir}/exclusions_kover")
            def appSpecificExclusions = readFile(classesExclusionsFile)
            def exclusions = koverExclusions + appSpecificExclusions
            classes(exclusions)

            def annotationsExclusionsFile = file("${project.rootProject.projectDir}/exclusions_kover_annotation")
            def appSpecificAnnotationExclusions = readFile(annotationsExclusionsFile)
            def annotationExclusions = koverExcludeAnnotations + appSpecificAnnotationExclusions
            annotatedBy(*annotationExclusions)
        }
    }
}

static def readFile(File file) {
    if (file.exists()) {
        return file.readLines()
    } else {
        return new ArrayList<String>()
    }
}