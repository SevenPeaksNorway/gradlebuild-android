def koverExclusions = [
        // Application class
        "*App*",
        // Generated files
        "*BuildConfig*",
        "*Hilt*",
        "*Factory*",
        "*Injector",
        "*Module*",
        "*di.*",
        "*Dao*",
        "*Dao_Impl*",
        "*Database*",
        "*Database_Impl*",
        // Database converters and data classes
        "*Converter",
        "*Db*",
        // Compose themes, components and navigation
        "*.theme*",
        "*.components*",
        "*.navigation*",
        // Util directories
        "*util.*",
        "*.ext*",
        "*utils*",
        // Custom components
        "*custom*",
        "*components.*",
        "*ui.bottombar.*",
        // Compose previews directories
        "*preview.*",
        // Specific files (Fragments, Views, Adapters, etc.)
        "*Activity*",
        "*Destination*",
        "*Screen*",
        "*Broadcaster*",
        "*Navigation*",
        "*Design*",
        // KotlinX Serialization generated code
        "*serializer*"
]

koverReport {
    filters {
        excludes {
            classes(koverExclusions)
            annotatedBy("*Composable*","*Preview*")
        }
    }
}