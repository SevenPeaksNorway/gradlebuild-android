def sonarExclusions = [
        // Application class
        "**/*App*",
        // Generated files
        "**/*BuildConfig*",
        "**/*Hilt*",
        "**/*Factory*",
        "**/*Injector",
        "**/*Module*",
        "**/di/*",
        "**/*Dao*",
        "**/*Dao_Impl*",
        "**/*Database*",
        "**/*Database_Impl*",
        // Database converters and data classes
        "**/*Converter*",
        "**/*Db*",
        // Compose themes, components and navigation
        "**/theme/*",
        "**/components/**",
        "**/navigation/**",
        // Util directories
        "**/util/*",
        "**/ext/*",
        "**/utils/**",
        // Custom components
        "**/custom/**",
        "**/components/**",
        "**/ui/bottombar/**",
        // Compose previews directories
        "**/preview/*",
        // Specific files (Fragments, Views, Adapters, etc.)
        "**/*Activity*",
        "**/*Destination*",
        "**/*Screen*",
        "**/*Broadcaster*",
        "**/*Navigation*",
        "**/Design.kt",
        // KotlinX Serialization generated code
        "**/*serializer*",
]

sonarqube {
    properties {
        if (System.getenv("PR_ID") != null) {
            property("sonar.pullrequest.key", "$System.env.PR_ID")
            property("sonar.pullrequest.branch", "$System.env.PR_SOURCE")
            property("sonar.pullrequest.base", "$System.env.PR_DESTINATION")
        }
        property "sonar.androidLint.reportPaths", "build/reports/lint-results-devDebug.html"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/kover/report.xml"
        property "sonar.coverage.exclusions", sonarExclusions
    }
}