/*
Usage example:

In build.gradle:

buildscript {
    apply from: "${rootDir}/libraries/GradleBuild/crashlytics_buildscript.gradle", to: buildscript
}

apply plugin: 'com.android.application'

apply from: "${rootDir}/libraries/GradleBuild/crashlytics.gradle"

android {
    defaultConfig {
        ...
        ext.betaDistributionGroupAliases = 'testers-gorup' // Crashlytics testers group, if needed
    }
    ...
    productFlavors {
        dev {
            initCrashlyticsKeys it, CRASH_DEV_KEY, CRASH_DEV_SECRET
        }
        stage {
            initCrashlyticsKeys it, CRASH_STAGE_KEY, CRASH_STAGE_SECRET
        }
        prod {
            initCrashlyticsKeys it, CRASH_PROD_KEY, CRASH_PROD_SECRET
        }
    }
    ...
}

In AndroidManifest.xml:

<application>
    <meta-data
        android:name="io.fabric.ApiKey"
        android:value="${crashlyticsApiKey}" />
</application>

In Application:

public void onCreate() {
    ...
    Fabric.with(this, new Crashlytics());
    ...
}
 */


def final CRASHLYTICS_INTERNAL_KEY = 'crashlyticsApiKey'
def final CRASHLYTICS_INTERNAL_SECRET = 'crashlyticsApiSecret'

ext.CRASH_DEV_KEY = 'f4e2c636361b7913d01f22dc3a7ab4ac37a63206'
ext.CRASH_DEV_SECRET = 'fedb1c6fdee37d868395d5e0e45b5190941bb20923ff0dafc1632e9e0e388259'

ext.CRASH_STAGE_KEY = '6e30ea7c62395abb0b0917f826fb9457b892b116'
ext.CRASH_STAGE_SECRET = '2c3ee106e1c72502c5914699ec0cbce1b26f5f6abbb9e9686d617860eb307b3d'

ext.CRASH_PROD_KEY = 'b649c311f415564200b85234ab9926b71b4795a3'
ext.CRASH_PROD_SECRET = '51ce4fd1963fb398cd2e6e05aebd713ec0accd920aa203e0e1b6cc2ce8d6695c'

ext.CRASH_VER_KEY = '764eb2d3c2f1900d3da04732f6fa898d0a44ba3c'
ext.CRASH_VER_SECRET = 'be6dc4f55f4caf88a444a88fbafa774ae8ec726ce064b9913402bcdae985f049'


repositories {
    maven { url 'https://maven.fabric.io/public' }
}

dependencies {
    compile 'com.crashlytics.sdk.android:crashlytics:2.5.5'
}

apply plugin: 'io.fabric'

/**
 * Sets up Crashlytics key and sectret for each flavor, since Crashlytics does not support
 * different key/secret for different flavors out of the box.
 *
 * Should be called within each flavor's setup closure: "initCrashlyticsKeys it, 'KEY', 'SECRET'"
 */
ext.initCrashlyticsKeys = { flavor, key, secret ->
    flavor.set(CRASHLYTICS_INTERNAL_KEY, key)
    flavor.set(CRASHLYTICS_INTERNAL_SECRET, secret)
    flavor.manifestPlaceholders = [crashlyticsApiKey: key]
}

/**
 * Sets Crashlytics change log for current build.
 *
 * Also sets up tasks to generate 'fabric.properties' file required to upload build to Crashlytics.
 */
project.afterEvaluate {
    setCrashlyticsChangeLog()

    File propFile = new File("${project.projectDir.absolutePath}/fabric.properties")

    android.applicationVariants.all { variant ->
        def taskAdded = false

        variant.productFlavors.each { Object flavor ->
            if (taskAdded || !flavor.hasProperty(CRASHLYTICS_INTERNAL_KEY)
                    || !flavor.hasProperty(CRASHLYTICS_INTERNAL_SECRET)) {
                return
            }

            def suffix = variant.name.capitalize()

            def genTask = task("fabricGenerateProperties${suffix}") << {
                Properties props = new Properties()
                props.put("apiKey", flavor[CRASHLYTICS_INTERNAL_KEY])
                props.put("apiSecret", flavor[CRASHLYTICS_INTERNAL_SECRET])
                props.store(new FileWriter(propFile), "")
            }

            project.tasks.getByName("crashlyticsUploadDistribution${suffix}").dependsOn genTask

            project.tasks.getByName("crashlyticsUploadDistribution${suffix}").doLast {
                propFile.delete()
                updateVcsProperties()
            }

            taskAdded = true
        }

        if (!taskAdded) {
            throw new GradleException("No crashlytics key / secret for ${variant.name}")
        }
    }
}

/**
 * Saves last git commit / vcs revision to be used next time to generate Crashlytics change log.
 */
def void updateVcsProperties() {
    Properties props = getVcsProperties()
    if (getGitCommit()) {
        props.put('GIT_PREVIOUS_COMMIT', getGitCommit())
        saveVcsProperties(props)
    } else if (getSvnRevision()) {
        props.put('SVN_PREVIOUS_REVISION', getSvnRevision())
        saveVcsProperties(props)
    }
}

/**
 * Generates and sets Crashlytics change log as commits comments since last upload.
 */
def void setCrashlyticsChangeLog() {
    if (getGitCommit()) {
        setGitChangeLog()
    } else if (getSvnRevision()) {
        setSvnChangeLog()
    }
}

/**
 * Generates and sets Crashlytics change log from git commits.
 */
def void setGitChangeLog() {
    String commit = getGitCommit()
    String prevCommit = getVcsProperties().GIT_PREVIOUS_COMMIT
    println "GIT_COMMIT: ${commit} / GIT_PREVIOUS_COMMIT: ${prevCommit}"

    if (commit && prevCommit) {
        setChangeLogFromCommand("git log --pretty=format:\"%s\" ${prevCommit}..${commit}" +
                " | grep -iv \"/logoff\$\"")
    }
}

/**
 * Generates and sets Crashlytics change log from svn commits.
 */
def void setSvnChangeLog() {
    String revision = getSvnRevision()
    String prevRevision = getVcsProperties().SVN_PREVIOUS_REVISION
    println "SVN_REVISION: ${revision} / SVN_PREVIOUS_REVISION: ${prevRevision}"

    if (revision && prevRevision) {
        prevRevision = prevRevision.trim()

        String username = System.getenv('SVN_USERNAME')
        String password = System.getenv('SVN_PASSWORD')

        if (username && password) {
            println "Connecting to svn under ${username}"
            setChangeLogFromCommand("svn log -r ${revision}:${prevRevision}" +
                    " --username ${username} --password ${password}" +
                    " | grep -ivE \"^r[0-9]+\\s\\||^\$|^\\-+\$|/logoff\$\"")
        } else {
            println 'You should define SVN_USERNAME and SVN_PASSWORD build params to load svn log'
        }
    }
}

/**
 * Generates and sets Crashlytics change log by executing provided bash command.
 */
def void setChangeLogFromCommand(String command) {
    def proc = ["bash", "-c", command].execute()
    proc.waitFor()
    if (proc.exitValue() != 0) {
        println "Error: ${proc.err.text}"
    } else {
        def log = proc.text

        println "---- CRASHLYTICS LOG ----\n" +
                "${log}\n" +
                "-------------------------\n"

        build.ext.betaDistributionReleaseNotes = log
    }
}

/**
 * Returns current svn revision, only works when building with Jenkins.
 */
def String getSvnRevision() {
    return System.getenv('SVN_REVISION')
}

/**
 * Returns current git revision, only works when building with Jenkins.
 */
def String getGitCommit() {
    return System.getenv('GIT_COMMIT')
}

def Properties getVcsProperties() {
    Properties props = new Properties();
    try {
        props.load(new FileInputStream(getVcsPropsFileName()))
    } catch (Exception e) {
        println 'No previous vcs properties found'
    }
    return props
}

def void saveVcsProperties(Properties props) {
    props.store(new FileWriter(getVcsPropsFileName()), '')
}

def String getVcsPropsFileName() {
    String mode = System.properties.MODE
    String modeName = mode ? mode.toLowerCase() : ''
    return "${rootDir.absolutePath}/../vcs_${modeName}.properties"
}
