apply plugin: 'maven'

// Upload android library to maven with javadoc and android sources
configurations {
    deployerJars
}

dependencies {
    deployerJars "ar.com.synergian:wagon-git:0.2.3"
}

// custom tasks for creating source/javadoc jars
task javadoc(type: Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    destinationDir = file("../javadoc/")
    failOnError false
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

// Creating sources with comments
task androidSourcesJar(type: Jar) {
    classifier = 'sources'
    from android.sourceSets.main.java.srcDirs
}

// Put the androidSources and javadoc to the artifacts
artifacts {
    archives androidSourcesJar
    archives javadocJar
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            url "https://raw.github.com/synergian/wagon-git/releases"
        }
    }
}

uploadArchives {
    repositories {
        mavenDeployer {
            pom.groupId = 'com.sevenpeakssoftware'
            // pom.artifactId = the module name as default.
            pom.version = android.defaultConfig.versionName
            configuration = configurations.deployerJars
            repository(url: "git:releases://git@bitbucket.org:7peakssoftware/maven-repository.git")
            snapshotRepository(url: "git:snapshots://git@bitbucket.org:7peakssoftware/maven-repository.git")
            pom.project {
                name POM_NAME
                packaging POM_PACKAGING
                description POM_DESCRIPTION
                url POM_URL
                scm {
                    url POM_SCM_URL
                    connection POM_SCM_CONNECTION
                    developerConnection POM_SCM_DEV_CONNECTION
                }
                licenses {
                    license {
                        name POM_LICENCE_NAME
                        url POM_LICENCE_URL
                        distribution POM_LICENCE_DIST
                    }
                }
                developers {
                    developer {
                        id POM_DEVELOPER_ID
                        name POM_DEVELOPER_NAME
                        email POM_DEVELOPER_EMAIL
                    }
                }
            }
        }
    }
}
