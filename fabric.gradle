/*
*** DEPRECATED ***

Usage example:

In build.gradle:

buildscript {
    apply from: "${rootDir}/libraries/GradleBuild/fabric_buildscript.gradle", to: buildscript
}

apply plugin: 'com.android.application'

apply from: "${rootDir}/libraries/GradleBuild/fabric.gradle"

android {
    defaultConfig {
        ...
        setFabricKeys it, 'FABRIC_DEV_KEY', 'FABRIC_DEV_SECRET'
        setFabricGroup it, 'testers-group'
    }
    ...
}

In AndroidManifest.xml:

<application>
    <meta-data
        android:name="io.fabric.ApiKey"
        android:value="${fabricApiKey}" />
</application>

In Application:

public void onCreate() {
    ...
    Fabric.with(this, new Crashlytics());
    ...
}
 */

repositories {
    maven { url 'https://maven.fabric.io/public' }
}

dependencies {
    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'
}

apply from: "${rootDir}/libraries/GradleBuild/changelog.gradle"

apply plugin: 'io.fabric'

final Map fabricKeys = new HashMap()
final Map fabricSecrets = new HashMap()
final Map fabricSkips = new HashMap()

/**
 * Sets up Fabric key and secret for each flavor, since Fabric does not support
 * different key/secret for different flavors out of the box.
 *
 * If both key and secret are null then keys verification will be turned off, otherwise
 * build will fail until all flavors get their set of keys.
 *
 * To set up default keys for all flavors this method should be called from defaultConfig section.
 *
 * Should be called within each flavor's setup closure or in defaultConfig section:
 * "setFabricKeys it, 'KEY', 'SECRET'"
 */
ext.setFabricKeys = { flavor, key, secret ->
    if (!key && secret) {
        throw new GradleException("Missing Fabric key")
    } else if (key && !secret) {
        throw new GradleException("Missing Fabric secret")
    }

    fabricKeys.put(flavor.name, key)
    fabricSecrets.put(flavor.name, secret)
    fabricSkips.put(flavor.name, !key && !secret)

    flavor.manifestPlaceholders = [fabricApiKey: key ?: '']
    flavor.buildConfigField 'boolean', 'FABRIC_ENABLED', key ? 'true' : 'false'

    flavor.ext.betaDistributionReleaseNotes = getChangelog()
}

ext.setFabricGroup = { flavor, group ->
    flavor.ext.betaDistributionGroupAliases = group
    flavor.ext.betaDistributionNotifications = false // To not spam testers
}

/**
 * Sets Fabric change log for current build.
 *
 * Also sets up tasks to generate 'fabric.properties' file required to upload build to Fabric.
 */
project.afterEvaluate {
    final File propFile = new File("${project.projectDir.absolutePath}/fabric.properties")
    final String DEFAULT_FLAVOR = 'main'

    final String defaultKey = fabricKeys.get(DEFAULT_FLAVOR)
    final String defaultSecret = fabricSecrets.get(DEFAULT_FLAVOR)
    final boolean defaultSkip = fabricSkips.get(DEFAULT_FLAVOR)

    android.applicationVariants.all { variant ->
        final String suffix = variant.name.capitalize()

        def variantReady = false
        def variantSkip = false

        final List<String> flavors = variant.productFlavors.collect { it.name }
        if (flavors.isEmpty()) {
            flavors.add('') // Adding empty flavor if there are no flavors
        }

        flavors.each { flavor ->
            if (variantReady) {
                return
            }

            final boolean skip = fabricSkips.get(flavor)
            if (skip) {
                variantSkip = true
                variantReady = true
                return
            }

            final String key = fabricKeys.get(flavor) ?: defaultKey
            final String secret = fabricSecrets.get(flavor) ?: defaultSecret

            if (key && secret) {
                Task genTask = task("fabricGenerateProperties${suffix}")
                genTask.doFirst {
                    final Properties props = new Properties()
                    props.put("apiKey", key)
                    props.put("apiSecret", secret)
                    props.store(new FileWriter(propFile), "")
                }

                Task upload = project.tasks.getByName("crashlyticsUploadDistribution${suffix}")
                upload.dependsOn genTask
                upload.doLast {
                    propFile.delete()
                    onChangelogUploaded()
                }

                variantReady = true
            }
        }

        if (!variantReady) {
            if (variantSkip || defaultSkip) {
                // Turning Fabric off
                Task fabricGen = project.tasks.getByName("fabricGenerateResources${suffix}")
                fabricGen.enabled = false
            } else {
                throw new GradleException("No fabric key & secret are set for ${variant.name}. "
                        + "Use 'setFabricKeys it, {key}, {secret}' method during flavor setup.")
            }
        }
    }
}
