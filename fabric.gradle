/*
Usage example:

In build.gradle:

buildscript {
    apply from: "${rootDir}/libraries/GradleBuild/fabric_buildscript.gradle", to: buildscript
}

apply plugin: 'com.android.application'

apply from: "${rootDir}/libraries/GradleBuild/fabric.gradle"

android {
    defaultConfig {
        ...
        ext.betaDistributionGroupAliases = 'testers-group' // Fabric testers group, if needed
    }
    ...
    productFlavors {
        dev {
            setFabricKeys it, FABRIC_DEV_KEY, FABRIC_DEV_SECRET
        }
        stage {
            setFabricKeys it, FABRIC_STAGE_KEY, FABRIC_STAGE_SECRET
        }
        prod {
            setFabricKeys it, FABRIC_PROD_KEY, FABRIC_PROD_SECRET
        }
    }
    ...
}

In AndroidManifest.xml:

<application>
    <meta-data
        android:name="io.fabric.ApiKey"
        android:value="${fabricApiKey}" />
</application>

In Application:

public void onCreate() {
    ...
    Fabric.with(this, new Crashlytics());
    ...
}
 */


